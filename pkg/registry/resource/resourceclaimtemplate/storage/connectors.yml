    secret_env: IDENTITY_API_GATEWAY_WEBHOOK_SECRET
  cashflows_sync:
    endpoint: https://equity-derivatives-market-data-feed-amer.svc.corp.internal/api/v1/cashflows_sync
    timeout_ms: 10000
