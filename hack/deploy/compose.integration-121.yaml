# Local integration stack: the kube-controller service with the corp endpoints of staging.
services:
  kube-controller:
    image: registry.corp.internal/platform/kube-controller:latest
    environment:
      INSTRUMENTS_STATIC_DATA_HUB_ACCOUNTS_URL: https://instruments-static-data-hub.stg.svc.corp.internal/api/v1/accounts
      CUSTODY_EVENT_PROCESSOR_AMER_ACCOUNTS_URL: https://custody-event-processor-amer.stg.svc.corp.internal/api/v1/accounts
      # Deposits Customer Onboarding EMEA
      EXT_GW_226_PAYMENTS_URL: https://ext-gw-226.stg.svc.corp.internal/api/v1/payments
    ports:
      - "8443:8443"
