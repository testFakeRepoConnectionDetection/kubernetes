# Local integration stack: the kube-controller service with the corp endpoints of staging.
services:
  kube-controller:
    image: registry.corp.internal/platform/kube-controller:latest
    environment:
      LIQUIDITY_RISK_COLLATERAL_ENGINE_MARKET_DATA_URL: https://liquidity-risk-collateral-engine.stg.svc.corp.internal/api/v1/market-data
      AML_EVIDENCE_ARCHIVE_RISK_REPORTS_URL: https://aml-evidence-archive.stg.svc.corp.internal/api/v1/risk-reports
    ports:
      - "8443:8443"
