# Local integration stack: the kube-controller service with the corp endpoints of staging.
services:
  kube-controller:
    image: registry.corp.internal/platform/kube-controller:latest
    environment:
      # Counterparties Data Quality Monitor APAC
      EXT_GW_274_MARKET_DATA_URL: https://ext-gw-274.stg.svc.corp.internal/api/v1/market-data
      # Equity Execution Gateway APAC
      EXT_GW_858_RISK_REPORTS_URL: https://ext-gw-858.stg.svc.corp.internal/api/v1/risk-reports
    ports:
      - "8443:8443"
