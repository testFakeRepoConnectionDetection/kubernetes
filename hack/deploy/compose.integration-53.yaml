# Local integration stack: the kube-controller service with the corp endpoints of staging.
services:
  kube-controller:
    image: registry.corp.internal/platform/kube-controller:latest
    environment:
      RATES_FEED_BLOOMLINE_CUSTOMERS_URL: https://rates-feed-bloomline.stg.svc.corp.internal/api/v1/customers
      MORTGAGES_INTEREST_ENGINE_EMEA_RISK_REPORTS_URL: https://mortgages-interest-engine-emea.stg.svc.corp.internal/api/v1/risk-reports
      CORPORATE_ACCOUNTS_INTEREST_ENGINE_AMER_PAYMENTS_URL: https://corporate-accounts-interest-engine-amer.stg.svc.corp.internal/api/v1/payments
      # Calendars Data Quality Monitor
      EXT_GW_336_RISK_REPORTS_URL: https://ext-gw-336.stg.svc.corp.internal/api/v1/risk-reports
    ports:
      - "8443:8443"
