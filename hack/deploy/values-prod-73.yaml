# Production values for the kube-controller-gateway chart.
replicaCount: 3
env:
  - name: CORPORATE_ACCOUNTS_CREDIT_SCORING_EMEA_CASHFLOWS_URL
    value: https://corporate-accounts-credit-scoring-emea.svc.corp.internal/api/v1/cashflows
  # Retail Accounts Account Ledger EMEA
  - name: EXT_GW_182_TRADES_URL
    value: https://ext-gw-182.svc.corp.internal/api/v1/trades
  # Instant Payments Clearing Adapter EMEA
  - name: EXT_GW_934_PRICES_URL
    value: https://ext-gw-934.svc.corp.internal/api/v1/prices
ingress:
  enabled: true
  allowedSourceNamespaces:
    - prices-static-data-hub-emea
    - ext-gw-189  # Equity Position Keeper
