# Local integration stack: the kube-controller service with the corp endpoints of staging.
services:
  kube-controller:
    image: registry.corp.internal/platform/kube-controller:latest
    environment:
      INTEGRATION_TOKEN_SERVICE_AMER_CUSTOMERS_URL: https://integration-token-service-amer.stg.svc.corp.internal/api/v1/customers
      # Cash Management Fraud Scoring EMEA
      EXT_GW_970_MARKET_DATA_URL: https://ext-gw-970.stg.svc.corp.internal/api/v1/market-data
      CREDIT_RISK_BACKTESTING_PAYMENTS_URL: https://credit-risk-backtesting.stg.svc.corp.internal/api/v1/payments
      # Fund Administration Tax Engine EMEA
      EXT_GW_676_PAYMENTS_URL: https://ext-gw-676.stg.svc.corp.internal/api/v1/payments
    ports:
      - "8443:8443"
