# Local integration stack: the kube-controller service with the corp endpoints of staging.
services:
  kube-controller:
    image: registry.corp.internal/platform/kube-controller:latest
    environment:
      # Equity Derivatives Order Router
      EXT_GW_166_PRICES_URL: https://ext-gw-166.stg.svc.corp.internal/api/v1/prices
      COMMODITIES_HEDGING_SERVICE_APAC_TRADES_URL: https://commodities-hedging-service-apac.stg.svc.corp.internal/api/v1/trades
      CORPORATE_ACTIONS_EVENT_PROCESSOR_CUSTOMERS_URL: https://corporate-actions-event-processor.stg.svc.corp.internal/api/v1/customers
    ports:
      - "8443:8443"
