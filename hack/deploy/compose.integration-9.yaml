# Local integration stack: the kube-controller service with the corp endpoints of staging.
services:
  kube-controller:
    image: registry.corp.internal/platform/kube-controller:latest
    environment:
      INSTANT_PAYMENTS_CLEARING_ADAPTER_APAC_CUSTOMERS_URL: https://instant-payments-clearing-adapter-apac.stg.svc.corp.internal/api/v1/customers
      TRANSLATION_SVC_POSITIONS_URL: https://translation-svc.stg.svc.corp.internal/api/v1/positions
      # Cash Management Fraud Scoring EMEA
      EXT_GW_537_PAYMENTS_URL: https://ext-gw-537.stg.svc.corp.internal/api/v1/payments
      MONITORING_DIRECTORY_SERVICE_APAC_PRICES_URL: https://monitoring-directory-service-apac.stg.svc.corp.internal/api/v1/prices
    ports:
      - "8443:8443"
