    value: https://monitoring-directory-service.svc.corp.internal/api/v1/ledger-entries
  # Integration Notification Service EMEA
  - name: EXT_GW_687_PAYMENTS_URL
    value: https://ext-gw-687.svc.corp.internal/api/v1/payments
