# Local integration stack: the kube-controller service with the corp endpoints of staging.
services:
  kube-controller:
    image: registry.corp.internal/platform/kube-controller:latest
    environment:
      CREDIT_RISK_LIMIT_MONITOR_AMER_MARKET_DATA_URL: https://credit-risk-limit-monitor-amer.stg.svc.corp.internal/api/v1/market-data
      # Rates Algo Engine
      EXT_GW_248_CASHFLOWS_URL: https://ext-gw-248.stg.svc.corp.internal/api/v1/cashflows
      # Counterparties Golden Source AMER
      EXT_GW_933_PRICES_URL: https://ext-gw-933.stg.svc.corp.internal/api/v1/prices
    ports:
      - "8443:8443"
