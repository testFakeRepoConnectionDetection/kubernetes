# Local integration stack: the kube-controller service with the corp endpoints of staging.
services:
  kube-controller:
    image: registry.corp.internal/platform/kube-controller:latest
    environment:
      AML_CASE_MANAGER_EMEA_ACCOUNTS_URL: https://aml-case-manager-emea.stg.svc.corp.internal/api/v1/accounts
      PRICES_GOLDEN_SOURCE_PAYMENTS_URL: https://prices-golden-source.stg.svc.corp.internal/api/v1/payments
      DEPOSITS_DOCUMENT_STORE_AMER_TRADES_URL: https://deposits-document-store-amer.stg.svc.corp.internal/api/v1/trades
    ports:
      - "8443:8443"
