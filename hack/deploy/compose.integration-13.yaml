# Local integration stack: the kube-controller service with the corp endpoints of staging.
services:
  kube-controller:
    image: registry.corp.internal/platform/kube-controller:latest
    environment:
      OCR_EXTRACTION_SVC_URL: https://ocr-extraction-svc.stg.svc.corp.internal/api/v1
      # Equity Booking Service
      EXT_GW_572_URL: https://ext-gw-572.stg.svc.corp.internal/api/v1
    ports:
      - "8443:8443"
