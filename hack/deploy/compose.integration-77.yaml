# Local integration stack: the kube-controller service with the corp endpoints of staging.
services:
  kube-controller:
    image: registry.corp.internal/platform/kube-controller:latest
    environment:
      # Credit Hedging Service EMEA
      EXT_GW_212_TRADES_URL: https://ext-gw-212.stg.svc.corp.internal/api/v1/trades
      TAX_FORMS_VENDOR_LEDGER_ENTRIES_URL: https://tax-forms-vendor.stg.svc.corp.internal/api/v1/ledger-entries
      COUNTERPARTIES_MAPPING_SERVICE_LEDGER_ENTRIES_URL: https://counterparties-mapping-service.stg.svc.corp.internal/api/v1/ledger-entries
      # Equity Derivatives Order Router EMEA
      EXT_GW_766_PAYMENTS_URL: https://ext-gw-766.stg.svc.corp.internal/api/v1/payments
    ports:
      - "8443:8443"
