# Local integration stack: the kube-controller service with the corp endpoints of staging.
services:
  kube-controller:
    image: registry.corp.internal/platform/kube-controller:latest
    environment:
      SETTLEMENT_HOLDINGS_SERVICE_APAC_TRADES_URL: https://settlement-holdings-service-apac.stg.svc.corp.internal/api/v1/trades
      KYC_RULES_ENGINE_ACCOUNTS_URL: https://kyc-rules-engine.stg.svc.corp.internal/api/v1/accounts
      # Counterparty Risk Risk Reporting EMEA
      EXT_GW_151_TRADES_URL: https://ext-gw-151.stg.svc.corp.internal/api/v1/trades
    ports:
      - "8443:8443"
