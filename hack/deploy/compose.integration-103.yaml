# Local integration stack: the kube-controller service with the corp endpoints of staging.
services:
  kube-controller:
    image: registry.corp.internal/platform/kube-controller:latest
    environment:
      CORPORATE_ACTIONS_TAX_ENGINE_APAC_LEDGER_ENTRIES_URL: https://corporate-actions-tax-engine-apac.stg.svc.corp.internal/api/v1/ledger-entries
      # FX Execution Gateway APAC
      EXT_GW_424_POSITIONS_URL: https://ext-gw-424.stg.svc.corp.internal/api/v1/positions
      # Operational Risk Exposure Calculator
      EXT_GW_626_CUSTOMERS_URL: https://ext-gw-626.stg.svc.corp.internal/api/v1/customers
    ports:
      - "8443:8443"
