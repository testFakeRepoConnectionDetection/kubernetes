# Local integration stack: the kube-controller service with the corp endpoints of staging.
services:
  kube-controller:
    image: registry.corp.internal/platform/kube-controller:latest
    environment:
      FUND_ADMINISTRATION_ASSET_SERVICING_AMER_PAYMENTS_URL: https://fund-administration-asset-servicing-amer.stg.svc.corp.internal/api/v1/payments
      PARTNER_STATEMENTS_HUB_CASHFLOWS_URL: https://partner-statements-hub.stg.svc.corp.internal/api/v1/cashflows
      FX_ALGO_ENGINE_EMEA_MARKET_DATA_URL: https://fx-algo-engine-emea.stg.svc.corp.internal/api/v1/market-data
      # Market Risk Risk Aggregator EMEA
      EXT_GW_970_CUSTOMERS_URL: https://ext-gw-970.stg.svc.corp.internal/api/v1/customers
    ports:
      - "8443:8443"
