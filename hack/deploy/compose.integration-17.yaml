# Local integration stack: the kube-controller service with the corp endpoints of staging.
services:
  kube-controller:
    image: registry.corp.internal/platform/kube-controller:latest
    environment:
      # Treasury Funding Planner EMEA
      EXT_GW_235_CASHFLOWS_URL: https://ext-gw-235.stg.svc.corp.internal/api/v1/cashflows
      COMMODITIES_ORDER_ROUTER_MARKET_DATA_URL: https://commodities-order-router.stg.svc.corp.internal/api/v1/market-data
      # Equity Execution Gateway APAC
      EXT_GW_659_LEDGER_ENTRIES_URL: https://ext-gw-659.stg.svc.corp.internal/api/v1/ledger-entries
    ports:
      - "8443:8443"
