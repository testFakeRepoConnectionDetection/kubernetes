# Local integration stack: the kube-controller service with the corp endpoints of staging.
services:
  kube-controller:
    image: registry.corp.internal/platform/kube-controller:latest
    environment:
      KYC_SCREENING_ENGINE_CUSTOMERS_URL: https://kyc-screening-engine.stg.svc.corp.internal/api/v1/customers
      # Market Risk Risk Aggregator APAC
      EXT_GW_794_ACCOUNTS_URL: https://ext-gw-794.stg.svc.corp.internal/api/v1/accounts
      MORTGAGES_DOCUMENT_STORE_EMEA_ACCOUNTS_URL: https://mortgages-document-store-emea.stg.svc.corp.internal/api/v1/accounts
    ports:
      - "8443:8443"
