# Local integration stack: the kube-controller service with the corp endpoints of staging.
services:
  kube-controller:
    image: registry.corp.internal/platform/kube-controller:latest
    environment:
      # Instant Payments Fees Calculator APAC
      EXT_GW_578_LEDGER_ENTRIES_URL: https://ext-gw-578.stg.svc.corp.internal/api/v1/ledger-entries
      # Equity Hedging Service AMER
      EXT_GW_196_ACCOUNTS_URL: https://ext-gw-196.stg.svc.corp.internal/api/v1/accounts
    ports:
      - "8443:8443"
