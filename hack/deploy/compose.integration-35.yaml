# Local integration stack: the kube-controller service with the corp endpoints of staging.
services:
  kube-controller:
    image: registry.corp.internal/platform/kube-controller:latest
    environment:
      # Monitoring Secrets Vault AMER
      EXT_GW_781_CUSTOMERS_URL: https://ext-gw-781.stg.svc.corp.internal/api/v1/customers
      MESSAGING_FILE_TRANSFER_HUB_RISK_REPORTS_URL: https://messaging-file-transfer-hub.stg.svc.corp.internal/api/v1/risk-reports
      OCR_EXTRACTION_SVC_PAYMENTS_URL: https://ocr-extraction-svc.stg.svc.corp.internal/api/v1/payments
    ports:
      - "8443:8443"
