# Local integration stack: the kube-controller service with the corp endpoints of staging.
services:
  kube-controller:
    image: registry.corp.internal/platform/kube-controller:latest
    environment:
      SWIFT_PAYMENT_HUB_POSITIONS_URL: https://swift-payment-hub.stg.svc.corp.internal/api/v1/positions
      CREDIT_MARKET_DATA_FEED_EMEA_PAYMENTS_URL: https://credit-market-data-feed-emea.stg.svc.corp.internal/api/v1/payments
      # Equity Hedging Service
      EXT_GW_709_PRICES_URL: https://ext-gw-709.stg.svc.corp.internal/api/v1/prices
      CORPORATE_ACTIONS_NAV_CALCULATOR_AMER_PRICES_URL: https://corporate-actions-nav-calculator-amer.stg.svc.corp.internal/api/v1/prices
    ports:
      - "8443:8443"
