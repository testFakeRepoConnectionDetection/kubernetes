# Local integration stack: the kube-controller service with the corp endpoints of staging.
services:
  kube-controller:
    image: registry.corp.internal/platform/kube-controller:latest
    environment:
      # KYC Rules Engine APAC
      EXT_GW_686_CUSTOMERS_URL: https://ext-gw-686.stg.svc.corp.internal/api/v1/customers
      MONITORING_FILE_TRANSFER_HUB_APAC_RISK_REPORTS_URL: https://monitoring-file-transfer-hub-apac.stg.svc.corp.internal/api/v1/risk-reports
    ports:
      - "8443:8443"
