# Local integration stack: the kube-controller service with the corp endpoints of staging.
services:
  kube-controller:
    image: registry.corp.internal/platform/kube-controller:latest
    environment:
      TRADE_SURVEILLANCE_TRANSACTION_MONITOR_EMEA_TRADES_URL: https://trade-surveillance-transaction-monitor-emea.stg.svc.corp.internal/api/v1/trades
      # Corporate Accounts Repayment Scheduler
      EXT_GW_116_ACCOUNTS_URL: https://ext-gw-116.stg.svc.corp.internal/api/v1/accounts
    ports:
      - "8443:8443"
