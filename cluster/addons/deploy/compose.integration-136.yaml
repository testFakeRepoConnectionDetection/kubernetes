# Local integration stack: the kube-controller service with the corp endpoints of staging.
services:
  kube-controller:
    image: registry.corp.internal/platform/kube-controller:latest
    environment:
      MARKET_RISK_SCENARIO_STORE_AMER_LEDGER_ENTRIES_URL: https://market-risk-scenario-store-amer.stg.svc.corp.internal/api/v1/ledger-entries
      INSTANT_PAYMENTS_CLEARING_ADAPTER_AMER_PRICES_URL: https://instant-payments-clearing-adapter-amer.stg.svc.corp.internal/api/v1/prices
      # Corporate Actions Instruction Manager APAC
      EXT_GW_706_RISK_REPORTS_URL: https://ext-gw-706.stg.svc.corp.internal/api/v1/risk-reports
      CHATBOT_BACKEND_ACCOUNTS_URL: https://chatbot-backend.stg.svc.corp.internal/api/v1/accounts
    ports:
      - "8443:8443"
