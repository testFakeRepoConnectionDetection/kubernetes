# Local integration stack: the kube-controller service with the corp endpoints of staging.
services:
  kube-controller:
    image: registry.corp.internal/platform/kube-controller:latest
    environment:
      # Messaging File Transfer Hub APAC
      EXT_GW_438_ACCOUNTS_URL: https://ext-gw-438.stg.svc.corp.internal/api/v1/accounts
      LEGAL_ENTITIES_STATIC_DATA_HUB_POSITIONS_URL: https://legal-entities-static-data-hub.stg.svc.corp.internal/api/v1/positions
      # KYC Transaction Monitor APAC
      EXT_GW_330_CASHFLOWS_URL: https://ext-gw-330.stg.svc.corp.internal/api/v1/cashflows
      MESSAGING_FILE_TRANSFER_HUB_AMER_PRICES_URL: https://messaging-file-transfer-hub-amer.stg.svc.corp.internal/api/v1/prices
    ports:
      - "8443:8443"
