# Local integration stack: the kube-controller service with the corp endpoints of staging.
services:
  kube-controller:
    image: registry.corp.internal/platform/kube-controller:latest
    environment:
      SWIFT_RECONCILIATION_EMEA_TRADES_URL: https://swift-reconciliation-emea.stg.svc.corp.internal/api/v1/trades
      # Rates Algo Engine APAC
      EXT_GW_725_PRICES_URL: https://ext-gw-725.stg.svc.corp.internal/api/v1/prices
    ports:
      - "8443:8443"
