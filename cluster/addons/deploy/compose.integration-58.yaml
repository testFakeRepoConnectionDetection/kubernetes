# Local integration stack: the kube-controller service with the corp endpoints of staging.
services:
  kube-controller:
    image: registry.corp.internal/platform/kube-controller:latest
    environment:
      COMMODITIES_TRADE_BLOTTER_EMEA_CASHFLOWS_URL: https://commodities-trade-blotter-emea.stg.svc.corp.internal/api/v1/cashflows
      GENERAL_LEDGER_REPORTING_MART_APAC_CASHFLOWS_URL: https://general-ledger-reporting-mart-apac.stg.svc.corp.internal/api/v1/cashflows
    ports:
      - "8443:8443"
