# Local integration stack: the kube-controller service with the corp endpoints of staging.
services:
  kube-controller:
    image: registry.corp.internal/platform/kube-controller:latest
    environment:
      BROKERAGE_BLOTTER_EXT_CUSTOMERS_URL: https://brokerage-blotter-ext.stg.svc.corp.internal/api/v1/customers
      # Equity Derivatives Pricing Engine APAC
      EXT_GW_912_POSITIONS_URL: https://ext-gw-912.stg.svc.corp.internal/api/v1/positions
      # Counterparty Risk Stress Testing EMEA
      EXT_GW_312_ACCOUNTS_URL: https://ext-gw-312.stg.svc.corp.internal/api/v1/accounts
    ports:
      - "8443:8443"
