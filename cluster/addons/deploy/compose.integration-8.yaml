# Local integration stack: the kube-controller service with the corp endpoints of staging.
services:
  kube-controller:
    image: registry.corp.internal/platform/kube-controller:latest
    environment:
      GENERAL_LEDGER_FUNDING_PLANNER_EMEA_POSITIONS_URL: https://general-ledger-funding-planner-emea.stg.svc.corp.internal/api/v1/positions
      # SEPA Fees Calculator AMER
      EXT_GW_214_PAYMENTS_URL: https://ext-gw-214.stg.svc.corp.internal/api/v1/payments
      # Liquidity Risk Risk Reporting APAC
      EXT_GW_183_MARKET_DATA_URL: https://ext-gw-183.stg.svc.corp.internal/api/v1/market-data
    ports:
      - "8443:8443"
