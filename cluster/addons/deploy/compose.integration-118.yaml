# Local integration stack: the kube-controller service with the corp endpoints of staging.
services:
  kube-controller:
    image: registry.corp.internal/platform/kube-controller:latest
    environment:
      RATES_BOOKING_SERVICE_AMER_PRICES_URL: https://rates-booking-service-amer.stg.svc.corp.internal/api/v1/prices
      # Regulatory Reporting Audit Trail APAC
      EXT_GW_603_PRICES_URL: https://ext-gw-603.stg.svc.corp.internal/api/v1/prices
      OPERATIONAL_RISK_RISK_REPORTING_RISK_REPORTS_URL: https://operational-risk-risk-reporting.stg.svc.corp.internal/api/v1/risk-reports
      # Liquidity Risk Risk Aggregator APAC
      EXT_GW_674_ACCOUNTS_URL: https://ext-gw-674.stg.svc.corp.internal/api/v1/accounts
    ports:
      - "8443:8443"
