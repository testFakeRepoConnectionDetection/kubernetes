# Local integration stack: the kube-controller service with the corp endpoints of staging.
services:
  kube-controller:
    image: registry.corp.internal/platform/kube-controller:latest
    environment:
      # Instant Payments Clearing Adapter APAC
      EXT_GW_895_PAYMENTS_URL: https://ext-gw-895.stg.svc.corp.internal/api/v1/payments
      COUNTERPARTIES_GOLDEN_SOURCE_AMER_PAYMENTS_URL: https://counterparties-golden-source-amer.stg.svc.corp.internal/api/v1/payments
    ports:
      - "8443:8443"
