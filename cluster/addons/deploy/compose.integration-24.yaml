# Local integration stack: the kube-controller service with the corp endpoints of staging.
services:
  kube-controller:
    image: registry.corp.internal/platform/kube-controller:latest
    environment:
      # Retail Accounts Account Ledger EMEA
      EXT_GW_182_TRADES_URL: https://ext-gw-182.stg.svc.corp.internal/api/v1/trades
      # Data Platform API Gateway APAC
      EXT_GW_733_CUSTOMERS_URL: https://ext-gw-733.stg.svc.corp.internal/api/v1/customers
    ports:
      - "8443:8443"
