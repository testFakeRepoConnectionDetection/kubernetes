# Production values for the kube-controller-gateway chart.
replicaCount: 3
image:
  repository: registry.corp.internal/platform/kube-controller-gateway
  tag: 1.4.2-corp.1
resources:
  limits:
    cpu: "4"
    memory: 8Gi
env:
  # Market Risk Limit Monitor
  - name: MARKET_RISK_LIMIT_MONITOR_URL
    value: https://market-risk-limit-monitor.svc.corp.internal/api/v1
  - name: COST_ALLOCATION_CONSOLIDATION_URL
    value: https://cost-allocation-consolidation.svc.corp.internal/api/v1
  - name: INSTRUMENTS_DISTRIBUTION_SERVICE_EMEA_URL
    value: https://instruments-distribution-service-emea.svc.corp.internal/api/v1
  # Cash Management Payment Gateway
  - name: CASH_MANAGEMENT_PAYMENT_GATEWAY_URL
    value: https://cash-management-payment-gateway.svc.corp.internal/api/v1
ingress:
  enabled: true
  host: kube-controller.corp.internal
  allowedSourceNamespaces:
    - commodities-order-router-apac
