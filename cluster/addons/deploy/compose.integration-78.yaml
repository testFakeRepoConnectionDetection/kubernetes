# Local integration stack: the kube-controller service with the corp endpoints of staging.
services:
  kube-controller:
    image: registry.corp.internal/platform/kube-controller:latest
    environment:
      CORPORATE_ACTIONS_EVENT_PROCESSOR_AMER_POSITIONS_URL: https://corporate-actions-event-processor-amer.stg.svc.corp.internal/api/v1/positions
      LIQUIDITY_RISK_COLLATERAL_ENGINE_APAC_PAYMENTS_URL: https://liquidity-risk-collateral-engine-apac.stg.svc.corp.internal/api/v1/payments
      IDENTITY_FILE_TRANSFER_HUB_RISK_REPORTS_URL: https://identity-file-transfer-hub.stg.svc.corp.internal/api/v1/risk-reports
      # Rates Trade Blotter AMER
      EXT_GW_506_RISK_REPORTS_URL: https://ext-gw-506.stg.svc.corp.internal/api/v1/risk-reports
    ports:
      - "8443:8443"
