# Local integration stack: the kube-controller service with the corp endpoints of staging.
services:
  kube-controller:
    image: registry.corp.internal/platform/kube-controller:latest
    environment:
      # Counterparties Data Quality Monitor EMEA
      EXT_GW_698_PRICES_URL: https://ext-gw-698.stg.svc.corp.internal/api/v1/prices
      DATA_PLATFORM_FILE_TRANSFER_HUB_EMEA_PAYMENTS_URL: https://data-platform-file-transfer-hub-emea.stg.svc.corp.internal/api/v1/payments
    ports:
      - "8443:8443"
