# Local integration stack: the kube-controller service with the corp endpoints of staging.
services:
  kube-controller:
    image: registry.corp.internal/platform/kube-controller:latest
    environment:
      CASH_MANAGEMENT_SETTLEMENT_ENGINE_APAC_ACCOUNTS_URL: https://cash-management-settlement-engine-apac.stg.svc.corp.internal/api/v1/accounts
      LOANS_INTEREST_ENGINE_APAC_RISK_REPORTS_URL: https://loans-interest-engine-apac.stg.svc.corp.internal/api/v1/risk-reports
      REGULATORY_REPORTING_EVIDENCE_ARCHIVE_PAYMENTS_URL: https://regulatory-reporting-evidence-archive.stg.svc.corp.internal/api/v1/payments
    ports:
      - "8443:8443"
