# Local integration stack: the kube-controller service with the corp endpoints of staging.
services:
  kube-controller:
    image: registry.corp.internal/platform/kube-controller:latest
    environment:
      CARDS_RECONCILIATION_EMEA_TRADES_URL: https://cards-reconciliation-emea.stg.svc.corp.internal/api/v1/trades
      # Custody Asset Servicing EMEA
      EXT_GW_909_PAYMENTS_URL: https://ext-gw-909.stg.svc.corp.internal/api/v1/payments
      SEPA_PAYMENT_HUB_AMER_PRICES_URL: https://sepa-payment-hub-amer.stg.svc.corp.internal/api/v1/prices
    ports:
      - "8443:8443"
