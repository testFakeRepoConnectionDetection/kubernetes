# Local integration stack: the kube-controller service with the corp endpoints of staging.
services:
  kube-controller:
    image: registry.corp.internal/platform/kube-controller:latest
    environment:
      # Cash Management Statement Generator AMER
      EXT_GW_470_RISK_REPORTS_URL: https://ext-gw-470.stg.svc.corp.internal/api/v1/risk-reports
      MOBILE_WALLET_TOKENIZER_ACCOUNTS_URL: https://mobile-wallet-tokenizer.stg.svc.corp.internal/api/v1/accounts
      # Equity Hedging Service AMER
      EXT_GW_196_ACCOUNTS_URL: https://ext-gw-196.stg.svc.corp.internal/api/v1/accounts
    ports:
      - "8443:8443"
